<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login — Sales & Marketing Tracker</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<!-- CENTER the login card on the page -->
<div class="d-flex justify-content-center align-items-center" style="min-height:100vh;">

    <div class="card shadow" style="width: 400px;">
        <div class="card-body p-4">

            <!-- Logo and heading -->
            <div class="text-center mb-4">
                <i class="bi bi-bar-chart-line-fill text-primary" style="font-size:2.5rem;"></i>
                <h4 class="mt-2 fw-bold">Sales & Marketing Tracker</h4>
                <p class="text-muted small">Sign in to your account</p>
            </div>

            <!-- Error message box (hidden until needed) -->
            <div id="loginError" class="alert alert-danger d-none" role="alert">
                Please enter both email and password.
            </div>

            <!-- Email field -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Email address</label>
                <input type="email" id="emailInput" class="form-control"
                       placeholder="you@example.com">
            </div>

            <!-- Password field -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>
                <input type="password" id="passwordInput" class="form-control"
                       placeholder="Enter your password">
            </div>

            <!-- Login button -->
            <div class="d-grid mt-4">
                <button id="loginBtn" class="btn btn-primary btn-lg fw-semibold">
                    Sign In
                </button>
            </div>

            <!-- Forgot password link -->
            <div class="text-center mt-3">
                <a href="#" class="text-muted small">Forgot password?</a>
            </div>

        </div>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>

<!-- Temporary placeholder login logic — Firebase will replace this on Day 3 -->
<script>
    document.getElementById('loginBtn').addEventListener('click', function() {
        const email    = document.getElementById('emailInput').value;
        const password = document.getElementById('passwordInput').value;

        // Show error if fields are empty
        if (!email || !password) {
            document.getElementById('loginError').classList.remove('d-none');
            return;
        }

        // Temporary message — real Firebase login comes Day 3
        alert('✅ Login scaffold is working! Firebase will be connected on Day 3.');
    });
</script>

</body>
</html>
