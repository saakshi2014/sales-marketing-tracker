<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, shrink-to-fit=no"/>
    <title>{% block title %}Sales & Marketing Tracker{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
          rel="stylesheet">

    <!-- Our custom CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/main.css') }}">

    {% block head %}{% endblock %}
</head>
<body>

<!-- ── NAVBAR ─────────────────────────────────────────────────────────────── -->
<nav class="navbar navbar-dark">
    <div class="container-fluid px-3">

        <!-- Brand -->
        <a class="navbar-brand d-flex align-items-center gap-2" href="#">
            <i class="bi bi-bar-chart-line-fill"></i>
            <span class="d-none d-sm-inline">Sales & Marketing Tracker</span>
            <span class="d-inline d-sm-none">SMT</span>
        </a>

        <!-- Right side: user info + logout -->
        <div class="d-flex align-items-center gap-2">

            <!-- Mobile sidebar toggle -->
            <button class="btn btn-outline-light btn-sm d-md-none"
                    id="sidebarToggle"
                    onclick="toggleMobileSidebar()">
                <i class="bi bi-list"></i>
            </button>

            <!-- User name (hidden on very small screens) -->
            <span class="text-white d-none d-sm-inline"
                  id="navUserName"
                  style="font-size:0.85rem; opacity:0.9;">
                {% if user_name %}{{ user_name }}{% endif %}
            </span>

            <!-- Logout button -->
            <a href="/logout"
               class="btn btn-outline-light btn-sm">
                <i class="bi bi-box-arrow-right"></i>
                <span class="d-none d-md-inline ms-1">Logout</span>
            </a>
        </div>

    </div>
</nav>

<!-- ── APP LAYOUT ─────────────────────────────────────────────────────────── -->
<div class="app-layout">

    <!-- SIDEBAR -->
<div class="sidebar d-none d-md-flex flex-column" id="mainSidebar">
        {% block sidebar %}{% endblock %}
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

</div>

<!-- ── MOBILE SIDEBAR OVERLAY ─────────────────────────────────────────────── -->
<div id="sidebarOverlay"
     class="d-none"
     style="position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.5); z-index:999;"
     onclick="toggleMobileSidebar()">
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>

<!-- Custom JS -->
<script src="{{ url_for('static', filename='js/main.js') }}"></script>

<!-- Mobile sidebar toggle script -->
<script>
// ── MOBILE SIDEBAR TOGGLE ─────────────────────────────────────────────────
const sidebar        = document.getElementById('mainSidebar');
const overlay        = document.getElementById('sidebarOverlay');
const sidebarToggle  = document.getElementById('sidebarToggle');
let   sidebarOpen    = false;

function toggleMobileSidebar() {
    sidebarOpen = !sidebarOpen;

    if (sidebarOpen) {
        // Open sidebar
        sidebar.style.cssText = `
            display:   block !important;
            position:  fixed !important;
            top:       56px !important;
            left:      0 !important;
            z-index:   1050 !important;
            width:     220px !important;
            height:    calc(100vh - 56px) !important;
            overflow-y: auto !important;
        `;
        overlay.classList.remove('d-none');
        document.body.style.overflow = 'hidden';
        if (sidebarToggle) {
            sidebarToggle.innerHTML = '<i class="bi bi-x-lg"></i>';
        }
    } else {
        // Close sidebar
        closeMobileSidebar();
    }
}

function closeMobileSidebar() {
    sidebarOpen         = false;
    sidebar.style.cssText = '';
    overlay.classList.add('d-none');
    document.body.style.overflow = '';
    if (sidebarToggle) {
        sidebarToggle.innerHTML = '<i class="bi bi-list"></i>';
    }
}

// Close when overlay is clicked
if (overlay) {
    overlay.addEventListener('click', closeMobileSidebar);
}

// Close sidebar when window resizes to desktop
window.addEventListener('resize', () => {
    if (window.innerWidth >= 768) {
        closeMobileSidebar();
        sidebar.style.cssText = '';
    }
});

// Close sidebar when a sidebar link is clicked on mobile
document.addEventListener('DOMContentLoaded', () => {
    const sidebarLinks = sidebar.querySelectorAll('a');
    sidebarLinks.forEach(link => {
        link.addEventListener('click', () => {
            if (window.innerWidth < 768) {
                closeMobileSidebar();
            }
        });
    });
});
</script>
{% block scripts %}{% endblock %}

</body>
</html>
