<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>{% block title %}Sales & Marketing Tracker{% endblock %}</title>

    <!-- Bootstrap 5 CSS — gives us ready-made buttons, tables, cards etc. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons — gives us icons like a funnel, bar chart etc. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
          rel="stylesheet">

    <!-- Our own custom CSS file -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>

    <!-- TOP NAVIGATION BAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary px-4">
        <a class="navbar-brand fw-bold" href="#">
            <i class="bi bi-bar-chart-line-fill me-2"></i>
            Sales & Marketing Tracker
        </a>
        <div class="ms-auto d-flex align-items-center">
            <span class="text-white me-3" id="navUserName"></span>
            <a href="/login" class="btn btn-outline-light btn-sm">
                <i class="bi bi-box-arrow-right me-1"></i>Logout
            </a>
        </div>
    </nav>

    <!-- MAIN LAYOUT — Sidebar on left, Content on right -->
    <div class="d-flex" style="min-height: calc(100vh - 56px);">

        <!-- LEFT SIDEBAR -->
        <div class="bg-dark text-white p-3" style="width: 220px; min-width: 220px;">
            {% block sidebar %}
            {% endblock %}
        </div>

        <!-- RIGHT CONTENT AREA -->
        <div class="flex-grow-1 p-4 bg-light">
            {% block content %}
            {% endblock %}
        </div>

    </div>

    <!-- Bootstrap 5 JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Our own JavaScript file -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
